<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Digital Calculator | Rajan Mastana</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.calc{width:360px;max-width:100%;background:#12120f;border:1px solid #d4af37;border-radius:20px;padding:20px;box-shadow:0 15px 50px #000}.calc h1{text-align:center;color:#d4af37}.display{width:100%;height:72px;background:#070707;color:#fff;border:1px solid #444;border-radius:10px;font-size:30px;text-align:right;padding:10px;margin-bottom:14px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{height:58px;border:0;border-radius:10px;background:#292919;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}.op,.eq{background:#d4af37;color:#111}.clear{background:#792525}.back{display:block;text-align:center;margin-top:16px;color:#d4af37;text-decoration:none}
</style></head><body><div class="calc"><h1>Digital Calculator</h1><input class="display" id="display" value="0" readonly>
<div class="keys">
<button class="clear" onclick="clearD()">C</button><button onclick="del()">⌫</button><button onclick="percent()">%</button><button class="op" onclick="choose('/')">÷</button>
<button onclick="num('7')">7</button><button onclick="num('8')">8</button><button onclick="num('9')">9</button><button class="op" onclick="choose('*')">×</button>
<button onclick="num('4')">4</button><button onclick="num('5')">5</button><button onclick="num('6')">6</button><button class="op" onclick="choose('-')">−</button>
<button onclick="num('1')">1</button><button onclick="num('2')">2</button><button onclick="num('3')">3</button><button class="op" onclick="choose('+')">+</button>
<button onclick="num('0')">0</button><button onclick="dot()">.</button><button class="eq" onclick="calc()">=</button><button class="op" onclick="sign()">±</button>
</div><a class="back" href="../index.html">← Back to Portfolio</a></div>
<script src="calculator.js"></script></body></html>
